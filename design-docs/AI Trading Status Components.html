<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trading Status & Feedback Components - 设计规范</title>
  <link rel="stylesheet" href="design-tokens.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-body), var(--font-chinese);
      background: var(--surface-background);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    
    #root {
      width: 100%;
      min-height: 100vh;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    @keyframes slideIn {
      from {
        transform: translateX(-100%);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { DesignCanvas, DCArtboard, DCSection } = window;
    
    // ==================== 1. RiskBanner ====================
    const RiskBanner = ({ 
      type = 'warning', // 'info' | 'warning' | 'danger'
      title = '',
      message = '',
      onDismiss = null,
      dismissible = true,
      icon = null
    }) => {
      const [visible, setVisible] = useState(true);
      
      const getConfig = () => {
        switch (type) {
          case 'danger':
            return {
              icon: icon || '⚠️',
              bg: 'var(--danger-light)',
              border: '#D4183D20',
              color: 'var(--danger)',
              textColor: 'var(--text-primary)'
            };
          case 'warning':
            return {
              icon: icon || '⚠️',
              bg: 'var(--warning-light)',
              border: '#EAB30820',
              color: 'var(--warning)',
              textColor: 'var(--text-primary)'
            };
          default:
            return {
              icon: icon || 'ℹ️',
              bg: 'var(--info-light)',
              border: '#007FFF20',
              color: 'var(--info)',
              textColor: 'var(--text-primary)'
            };
        }
      };
      
      const config = getConfig();
      
      if (!visible) return null;
      
      return (
        <div style={{
          width: '100%',
          padding: 'var(--spacing-md)',
          borderRadius: 'var(--radius-lg)',
          background: config.bg,
          border: `1px solid ${config.border}`,
          display: 'flex',
          alignItems: 'flex-start',
          gap: 'var(--spacing-md)',
          animation: 'slideIn 0.3s ease'
        }}>
          <div style={{
            fontSize: '20px',
            lineHeight: 1,
            flexShrink: 0
          }}>
            {config.icon}
          </div>
          <div style={{ flex: 1 }}>
            {title && (
              <div style={{
                fontSize: 'var(--text-sm)',
                fontWeight: 'var(--weight-semibold)',
                color: config.textColor,
                marginBottom: '4px'
              }}>
                {title}
              </div>
            )}
            <div style={{
              fontSize: 'var(--text-sm)',
              color: 'var(--text-secondary)',
              lineHeight: 'var(--leading-relaxed)'
            }}>
              {message}
            </div>
          </div>
          {dismissible && (
            <button
              onClick={() => {
                setVisible(false);
                onDismiss && onDismiss();
              }}
              style={{
                width: '24px',
                height: '24px',
                borderRadius: '50%',
                border: 'none',
                background: 'rgba(0,0,0,0.05)',
                color: 'var(--text-secondary)',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: '14px',
                flexShrink: 0,
                transition: 'all var(--transition-fast)'
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.background = 'rgba(0,0,0,0.1)';
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.background = 'rgba(0,0,0,0.05)';
              }}
            >
              ×
            </button>
          )}
        </div>
      );
    };
    
    // ==================== 2. StrategyStatusCard ====================
    const StrategyStatusCard = ({
      strategyName = 'Funding Harvester',
      strategyId = 'strategy_001',
      status = 'running', // 'pending' | 'running' | 'paused' | 'stopped' | 'completed'
      totalInvestment = 2500,
      currentEquity = 2615.50,
      totalPnl = 115.50,
      roe = 4.62,
      assets = ['BTC', 'ETH'],
      nextRebalance = '2h 15m',
      lastUpdate = '5分钟前',
      onViewDetails = () => {},
      onPause = () => {},
      onResume = () => {},
      onStop = () => {}
    }) => {
      const assetLogos = {
        BTC: 'https://s2.coinmarketcap.com/static/img/coins/64x64/1.png',
        ETH: 'https://s2.coinmarketcap.com/static/img/coins/64x64/1027.png',
        SOL: 'https://s2.coinmarketcap.com/static/img/coins/64x64/5426.png',
        HYPE: 'https://s2.coinmarketcap.com/static/img/coins/64x64/32196.png'
      };
      
      const getStatusConfig = () => {
        switch (status) {
          case 'pending':
            return {
              label: '待启动',
              color: 'var(--text-secondary)',
              bg: 'var(--surface-secondary)',
              icon: '⏳'
            };
          case 'running':
            return {
              label: '运行中',
              color: 'var(--success)',
              bg: 'var(--success-light)',
              icon: '▶️'
            };
          case 'paused':
            return {
              label: '已暂停',
              color: 'var(--warning)',
              bg: 'var(--warning-light)',
              icon: '⏸️'
            };
          case 'stopped':
            return {
              label: '已停止',
              color: 'var(--text-secondary)',
              bg: 'var(--surface-secondary)',
              icon: '⏹️'
            };
          case 'completed':
            return {
              label: '已完成',
              color: 'var(--brand-primary)',
              bg: 'var(--surface-accent)',
              icon: '✓'
            };
          default:
            return {
              label: '未知',
              color: 'var(--text-secondary)',
              bg: 'var(--surface-secondary)',
              icon: '•'
            };
        }
      };
      
      const statusConfig = getStatusConfig();
      const pnlColor = totalPnl >= 0 ? 'var(--success)' : 'var(--danger)';
      const pnlSign = totalPnl >= 0 ? '+' : '';
      
      return (
        <div style={{
          width: '100%',
          maxWidth: '480px',
          borderRadius: 'var(--radius-xl)',
          background: 'var(--surface-card)',
          border: '1px solid var(--border-light)',
          boxShadow: 'var(--shadow-lg)',
          overflow: 'hidden'
        }}>
          {/* Header */}
          <div style={{
            padding: 'var(--spacing-xl)',
            borderBottom: '1px solid var(--border-light)'
          }}>
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'flex-start',
              marginBottom: 'var(--spacing-md)'
            }}>
              <div style={{ flex: 1 }}>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: '4px'
                }}>
                  策略 · {strategyId}
                </div>
                <div style={{
                  fontSize: 'var(--text-xl)',
                  fontWeight: 'var(--weight-bold)',
                  color: 'var(--text-primary)',
                  marginBottom: 'var(--spacing-xs)'
                }}>
                  {strategyName}
                </div>
                <div style={{
                  display: 'flex',
                  alignItems: 'center',
                  gap: 'var(--spacing-xs)'
                }}>
                  {assets.map(asset => (
                    <img 
                      key={asset}
                      src={assetLogos[asset]}
                      alt={asset}
                      style={{ 
                        width: '20px', 
                        height: '20px',
                        borderRadius: '50%',
                        border: '1px solid var(--border-light)'
                      }}
                    />
                  ))}
                  <span style={{
                    fontSize: 'var(--text-xs)',
                    color: 'var(--text-secondary)',
                    marginLeft: 'var(--spacing-xs)'
                  }}>
                    {assets.join(' · ')}
                  </span>
                </div>
              </div>
              <div style={{
                padding: '6px 12px',
                borderRadius: 'var(--radius-md)',
                background: statusConfig.bg,
                border: `1px solid ${statusConfig.color}20`,
                fontSize: 'var(--text-sm)',
                fontWeight: 'var(--weight-semibold)',
                color: statusConfig.color,
                display: 'flex',
                alignItems: 'center',
                gap: '4px',
                whiteSpace: 'nowrap'
              }}>
                <span>{statusConfig.icon}</span>
                {statusConfig.label}
              </div>
            </div>
            
            {/* PnL Display */}
            <div style={{
              display: 'grid',
              gridTemplateColumns: '1fr 1fr',
              gap: 'var(--spacing-lg)',
              padding: 'var(--spacing-lg)',
              borderRadius: 'var(--radius-lg)',
              background: 'var(--surface-cool)'
            }}>
              <div>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: '4px'
                }}>
                  总盈亏
                </div>
                <div style={{
                  fontFamily: 'var(--font-mono)',
                  fontSize: 'var(--text-2xl)',
                  fontWeight: 'var(--weight-bold)',
                  color: pnlColor
                }}>
                  {pnlSign}${Math.abs(totalPnl).toFixed(2)}
                </div>
              </div>
              <div>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: '4px'
                }}>
                  回报率
                </div>
                <div style={{
                  fontFamily: 'var(--font-mono)',
                  fontSize: 'var(--text-2xl)',
                  fontWeight: 'var(--weight-bold)',
                  color: pnlColor
                }}>
                  {pnlSign}{roe.toFixed(2)}%
                </div>
              </div>
            </div>
          </div>
          
          {/* Details */}
          <div style={{
            padding: 'var(--spacing-xl)',
            display: 'flex',
            flexDirection: 'column',
            gap: 'var(--spacing-md)'
          }}>
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center'
            }}>
              <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                总投入
              </span>
              <span style={{
                fontSize: 'var(--text-base)',
                fontWeight: 'var(--weight-semibold)',
                fontFamily: 'var(--font-mono)',
                color: 'var(--text-primary)'
              }}>
                ${totalInvestment.toLocaleString()}
              </span>
            </div>
            
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center'
            }}>
              <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                当前权益
              </span>
              <span style={{
                fontSize: 'var(--text-base)',
                fontWeight: 'var(--weight-semibold)',
                fontFamily: 'var(--font-mono)',
                color: 'var(--text-primary)'
              }}>
                ${currentEquity.toLocaleString()}
              </span>
            </div>
            
            {status === 'running' && (
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center',
                padding: 'var(--spacing-md)',
                borderRadius: 'var(--radius-md)',
                background: 'var(--surface-blue-light)',
                marginTop: 'var(--spacing-sm)'
              }}>
                <span style={{ 
                  fontSize: 'var(--text-sm)', 
                  color: 'var(--text-secondary)',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 'var(--spacing-xs)'
                }}>
                  <span style={{
                    width: '6px',
                    height: '6px',
                    borderRadius: '50%',
                    background: 'var(--brand-primary)',
                    animation: 'pulse 2s infinite'
                  }} />
                  下次再平衡
                </span>
                <span style={{
                  fontSize: 'var(--text-base)',
                  fontWeight: 'var(--weight-semibold)',
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--brand-primary)'
                }}>
                  {nextRebalance}
                </span>
              </div>
            )}
            
            <div style={{
              fontSize: 'var(--text-xs)',
              color: 'var(--text-tertiary)',
              textAlign: 'right',
              marginTop: 'var(--spacing-xs)'
            }}>
              最后更新: {lastUpdate}
            </div>
          </div>
          
          {/* Actions */}
          <div style={{
            padding: 'var(--spacing-xl)',
            borderTop: '1px solid var(--border-light)',
            display: 'flex',
            gap: 'var(--spacing-md)'
          }}>
            <button
              onClick={onViewDetails}
              style={{
                flex: 1,
                padding: 'var(--spacing-md)',
                borderRadius: 'var(--radius-lg)',
                border: '1px solid var(--border-light)',
                background: 'var(--surface-card)',
                color: 'var(--text-primary)',
                fontSize: 'var(--text-sm)',
                fontWeight: 'var(--weight-semibold)',
                cursor: 'pointer',
                transition: 'all var(--transition-base)'
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.background = 'var(--surface-secondary)';
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.background = 'var(--surface-card)';
              }}
            >
              查看详情
            </button>
            
            {status === 'running' && (
              <button
                onClick={onPause}
                style={{
                  padding: 'var(--spacing-md) var(--spacing-lg)',
                  borderRadius: 'var(--radius-lg)',
                  border: '1px solid var(--warning)',
                  background: 'var(--warning-light)',
                  color: 'var(--warning)',
                  fontSize: 'var(--text-sm)',
                  fontWeight: 'var(--weight-semibold)',
                  cursor: 'pointer',
                  transition: 'all var(--transition-base)'
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.background = 'var(--warning)';
                  e.currentTarget.style.color = 'white';
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.background = 'var(--warning-light)';
                  e.currentTarget.style.color = 'var(--warning)';
                }}
              >
                暂停
              </button>
            )}
            
            {status === 'paused' && (
              <button
                onClick={onResume}
                style={{
                  padding: 'var(--spacing-md) var(--spacing-lg)',
                  borderRadius: 'var(--radius-lg)',
                  border: 'none',
                  background: 'var(--success)',
                  color: 'white',
                  fontSize: 'var(--text-sm)',
                  fontWeight: 'var(--weight-semibold)',
                  cursor: 'pointer',
                  transition: 'all var(--transition-base)',
                  boxShadow: 'var(--shadow-sm)'
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.transform = 'translateY(-2px)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-md)';
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.transform = 'translateY(0)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-sm)';
                }}
              >
                恢复
              </button>
            )}
          </div>
        </div>
      );
    };
    
    // ==================== 3. ExecutionProgress ====================
    const ExecutionProgress = ({
      steps = [],
      currentStep = 0,
      status = 'processing' // 'processing' | 'success' | 'error'
    }) => {
      return (
        <div style={{
          width: '100%',
          maxWidth: '420px',
          padding: 'var(--spacing-xl)',
          borderRadius: 'var(--radius-xl)',
          background: 'var(--surface-card)',
          border: '1px solid var(--border-light)',
          boxShadow: 'var(--shadow-lg)'
        }}>
          <div style={{
            display: 'flex',
            flexDirection: 'column',
            gap: 'var(--spacing-lg)'
          }}>
            {steps.map((step, index) => {
              const isCompleted = index < currentStep;
              const isCurrent = index === currentStep;
              const isPending = index > currentStep;
              
              let stepStatus = 'pending';
              if (isCompleted) stepStatus = 'completed';
              if (isCurrent) {
                stepStatus = status === 'error' ? 'error' : 'processing';
              }
              
              const getStepConfig = () => {
                switch (stepStatus) {
                  case 'completed':
                    return {
                      icon: '✓',
                      iconBg: 'var(--success)',
                      iconColor: 'white',
                      lineColor: 'var(--success)'
                    };
                  case 'processing':
                    return {
                      icon: (
                        <div style={{
                          width: '16px',
                          height: '16px',
                          border: '3px solid var(--brand-primary)',
                          borderTopColor: 'transparent',
                          borderRadius: '50%',
                          animation: 'spin 1s linear infinite'
                        }} />
                      ),
                      iconBg: 'var(--surface-accent)',
                      iconColor: 'var(--brand-primary)',
                      lineColor: 'var(--border-light)'
                    };
                  case 'error':
                    return {
                      icon: '✕',
                      iconBg: 'var(--danger)',
                      iconColor: 'white',
                      lineColor: 'var(--border-light)'
                    };
                  default:
                    return {
                      icon: '•',
                      iconBg: 'var(--surface-secondary)',
                      iconColor: 'var(--text-tertiary)',
                      lineColor: 'var(--border-light)'
                    };
                }
              };
              
              const config = getStepConfig();
              
              return (
                <div key={index} style={{ position: 'relative' }}>
                  <div style={{
                    display: 'flex',
                    alignItems: 'flex-start',
                    gap: 'var(--spacing-md)'
                  }}>
                    {/* Icon */}
                    <div style={{
                      width: '32px',
                      height: '32px',
                      borderRadius: '50%',
                      background: config.iconBg,
                      color: config.iconColor,
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      fontSize: '14px',
                      fontWeight: 'bold',
                      flexShrink: 0,
                      position: 'relative',
                      zIndex: 1,
                      transition: 'all var(--transition-base)'
                    }}>
                      {config.icon}
                    </div>
                    
                    {/* Content */}
                    <div style={{ flex: 1, paddingTop: '4px' }}>
                      <div style={{
                        fontSize: 'var(--text-sm)',
                        fontWeight: 'var(--weight-semibold)',
                        color: isCurrent ? 'var(--text-primary)' : 'var(--text-secondary)',
                        marginBottom: '2px'
                      }}>
                        {step.label}
                      </div>
                      {step.description && (
                        <div style={{
                          fontSize: 'var(--text-xs)',
                          color: 'var(--text-tertiary)',
                          lineHeight: 'var(--leading-relaxed)'
                        }}>
                          {step.description}
                        </div>
                      )}
                      {stepStatus === 'error' && step.error && (
                        <div style={{
                          marginTop: 'var(--spacing-xs)',
                          padding: 'var(--spacing-sm)',
                          borderRadius: 'var(--radius-sm)',
                          background: 'var(--danger-light)',
                          fontSize: 'var(--text-xs)',
                          color: 'var(--danger)'
                        }}>
                          {step.error}
                        </div>
                      )}
                    </div>
                  </div>
                  
                  {/* Connecting Line */}
                  {index < steps.length - 1 && (
                    <div style={{
                      position: 'absolute',
                      left: '15px',
                      top: '32px',
                      width: '2px',
                      height: 'calc(100% - 8px)',
                      background: config.lineColor,
                      transition: 'all var(--transition-base)'
                    }} />
                  )}
                </div>
              );
            })}
          </div>
          
          {/* Summary */}
          {status === 'success' && currentStep === steps.length && (
            <div style={{
              marginTop: 'var(--spacing-lg)',
              padding: 'var(--spacing-md)',
              borderRadius: 'var(--radius-lg)',
              background: 'var(--success-light)',
              border: '1px solid var(--success-border)',
              display: 'flex',
              alignItems: 'center',
              gap: 'var(--spacing-sm)'
            }}>
              <span style={{ fontSize: '18px' }}>✓</span>
              <span style={{
                fontSize: 'var(--text-sm)',
                fontWeight: 'var(--weight-semibold)',
                color: 'var(--success)'
              }}>
                执行完成
              </span>
            </div>
          )}
          
          {status === 'error' && (
            <div style={{
              marginTop: 'var(--spacing-lg)',
              padding: 'var(--spacing-md)',
              borderRadius: 'var(--radius-lg)',
              background: 'var(--danger-light)',
              border: '1px solid #D4183D20',
              display: 'flex',
              alignItems: 'center',
              gap: 'var(--spacing-sm)'
            }}>
              <span style={{ fontSize: '18px' }}>✕</span>
              <span style={{
                fontSize: 'var(--text-sm)',
                fontWeight: 'var(--weight-semibold)',
                color: 'var(--danger)'
              }}>
                执行失败，请重试
              </span>
            </div>
          )}
        </div>
      );
    };
    
    // ==================== 4. BridgePanel ====================
    const BridgePanel = ({
      fromChain = 'Tron',
      toChain = 'Hyperliquid',
      fromAsset = 'USDT',
      toAsset = 'USDC',
      availableBalance = 1250.00,
      estimatedFee = 1.50,
      estimatedTime = '~5 分钟',
      onConfirm = () => {},
      onCancel = () => {},
      loading = false
    }) => {
      const [amount, setAmount] = useState('');
      const [error, setError] = useState(null);
      
      const handleAmountChange = (val) => {
        setAmount(val);
        const numVal = parseFloat(val);
        if (numVal > availableBalance) {
          setError('金额超过可用余额');
        } else if (numVal < 10 && numVal > 0) {
          setError('最小跨链金额为 $10');
        } else {
          setError(null);
        }
      };
      
      const handleMaxClick = () => {
        const maxAmount = Math.max(0, availableBalance - estimatedFee);
        setAmount(maxAmount.toFixed(2));
        setError(null);
      };
      
      const receiveAmount = amount ? (parseFloat(amount) - estimatedFee).toFixed(2) : '0.00';
      const canConfirm = amount && parseFloat(amount) >= 10 && parseFloat(amount) <= availableBalance && !loading;
      
      return (
        <div style={{
          width: '100%',
          maxWidth: '440px',
          borderRadius: 'var(--radius-xl)',
          background: 'var(--surface-card)',
          border: '1px solid var(--border-light)',
          boxShadow: 'var(--shadow-lg)',
          overflow: 'hidden'
        }}>
          {/* Header */}
          <div style={{
            padding: 'var(--spacing-xl)',
            background: 'linear-gradient(135deg, var(--surface-accent) 0%, var(--surface-blue-light) 100%)',
            borderBottom: '1px solid var(--border-light)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between'
          }}>
            <div>
              <div style={{
                fontSize: 'var(--text-2xl)',
                fontWeight: 'var(--weight-bold)',
                color: 'var(--text-primary)'
              }}>
                跨链桥接
              </div>
              <div style={{
                fontSize: 'var(--text-sm)',
                color: 'var(--text-secondary)',
                marginTop: '4px'
              }}>
                从 {fromChain} 转移到 {toChain}
              </div>
            </div>
            <button
              onClick={onCancel}
              style={{
                width: '32px',
                height: '32px',
                borderRadius: '50%',
                border: 'none',
                background: 'white',
                color: 'var(--text-secondary)',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: '18px',
                boxShadow: 'var(--shadow-sm)',
                transition: 'all var(--transition-fast)'
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.background = 'var(--surface-secondary)';
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.background = 'white';
              }}
            >
              ×
            </button>
          </div>
          
          {/* Content */}
          <div style={{
            padding: 'var(--spacing-xl)',
            display: 'flex',
            flexDirection: 'column',
            gap: 'var(--spacing-xl)'
          }}>
            {/* Chain Flow */}
            <div style={{
              display: 'flex',
              flexDirection: 'column',
              gap: 'var(--spacing-md)'
            }}>
              {/* From */}
              <div style={{
                padding: 'var(--spacing-lg)',
                borderRadius: 'var(--radius-lg)',
                background: 'var(--surface-cool)',
                border: '1px solid var(--border-light)'
              }}>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: 'var(--spacing-sm)'
                }}>
                  从链
                </div>
                <div style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center'
                }}>
                  <div style={{
                    fontSize: 'var(--text-lg)',
                    fontWeight: 'var(--weight-bold)',
                    color: 'var(--text-primary)'
                  }}>
                    {fromChain}
                  </div>
                  <div style={{
                    padding: '4px 10px',
                    borderRadius: 'var(--radius-sm)',
                    background: 'white',
                    fontSize: 'var(--text-sm)',
                    fontWeight: 'var(--weight-semibold)',
                    color: 'var(--text-primary)'
                  }}>
                    {fromAsset}
                  </div>
                </div>
              </div>
              
              {/* Arrow */}
              <div style={{
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center'
              }}>
                <div style={{
                  width: '40px',
                  height: '40px',
                  borderRadius: '50%',
                  background: 'var(--brand-primary)',
                  color: 'white',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: '20px',
                  fontWeight: 'bold',
                  boxShadow: 'var(--shadow-md)'
                }}>
                  ↓
                </div>
              </div>
              
              {/* To */}
              <div style={{
                padding: 'var(--spacing-lg)',
                borderRadius: 'var(--radius-lg)',
                background: 'var(--surface-cool)',
                border: '1px solid var(--border-light)'
              }}>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: 'var(--spacing-sm)'
                }}>
                  到链
                </div>
                <div style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center'
                }}>
                  <div style={{
                    fontSize: 'var(--text-lg)',
                    fontWeight: 'var(--weight-bold)',
                    color: 'var(--text-primary)'
                  }}>
                    {toChain}
                  </div>
                  <div style={{
                    padding: '4px 10px',
                    borderRadius: 'var(--radius-sm)',
                    background: 'white',
                    fontSize: 'var(--text-sm)',
                    fontWeight: 'var(--weight-semibold)',
                    color: 'var(--text-primary)'
                  }}>
                    {toAsset}
                  </div>
                </div>
              </div>
            </div>
            
            {/* Amount Input */}
            <div style={{
              display: 'flex',
              flexDirection: 'column',
              gap: 'var(--spacing-sm)'
            }}>
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <label style={{
                  fontSize: 'var(--text-base)',
                  fontWeight: 'var(--weight-semibold)',
                  color: 'var(--text-primary)'
                }}>
                  转账金额
                </label>
                <div style={{
                  fontSize: 'var(--text-sm)',
                  color: 'var(--text-secondary)'
                }}>
                  可用: <span style={{
                    fontFamily: 'var(--font-mono)',
                    fontWeight: 'var(--weight-semibold)',
                    color: 'var(--text-primary)'
                  }}>
                    ${availableBalance.toLocaleString()}
                  </span>
                </div>
              </div>
              
              <div style={{
                position: 'relative',
                display: 'flex',
                alignItems: 'center',
                padding: 'var(--spacing-md) var(--spacing-lg)',
                borderRadius: 'var(--radius-lg)',
                border: error 
                  ? '2px solid var(--danger)' 
                  : '1px solid var(--border-light)',
                background: 'var(--surface-input)',
                transition: 'all var(--transition-base)'
              }}>
                <div style={{
                  fontSize: 'var(--text-xl)',
                  color: 'var(--text-secondary)',
                  marginRight: 'var(--spacing-sm)',
                  fontWeight: 'var(--weight-medium)'
                }}>
                  $
                </div>
                <input
                  type="text"
                  value={amount}
                  onChange={(e) => {
                    const val = e.target.value.replace(/[^0-9.]/g, '');
                    handleAmountChange(val);
                  }}
                  placeholder="输入金额"
                  style={{
                    flex: 1,
                    border: 'none',
                    outline: 'none',
                    background: 'transparent',
                    fontSize: 'var(--text-xl)',
                    fontFamily: 'var(--font-mono)',
                    fontWeight: 'var(--weight-semibold)',
                    color: 'var(--text-primary)',
                    padding: 0
                  }}
                />
                <button
                  onClick={handleMaxClick}
                  style={{
                    padding: '4px 10px',
                    borderRadius: 'var(--radius-sm)',
                    border: '1px solid var(--brand-primary)',
                    background: 'var(--surface-accent)',
                    color: 'var(--brand-primary)',
                    fontSize: 'var(--text-sm)',
                    fontWeight: 'var(--weight-semibold)',
                    cursor: 'pointer',
                    transition: 'all var(--transition-fast)'
                  }}
                  onMouseEnter={(e) => {
                    e.currentTarget.style.background = 'var(--brand-primary)';
                    e.currentTarget.style.color = 'var(--text-white)';
                  }}
                  onMouseLeave={(e) => {
                    e.currentTarget.style.background = 'var(--surface-accent)';
                    e.currentTarget.style.color = 'var(--brand-primary)';
                  }}
                >
                  MAX
                </button>
              </div>
              
              {error && (
                <div style={{
                  fontSize: 'var(--text-sm)',
                  color: 'var(--danger)',
                  display: 'flex',
                  alignItems: 'center',
                  gap: 'var(--spacing-xs)'
                }}>
                  ⚠️ {error}
                </div>
              )}
            </div>
            
            {/* Summary */}
            <div style={{
              padding: 'var(--spacing-lg)',
              borderRadius: 'var(--radius-lg)',
              background: 'var(--surface-cool)',
              border: '1px solid var(--border-light)',
              display: 'flex',
              flexDirection: 'column',
              gap: 'var(--spacing-sm)'
            }}>
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  跨链手续费
                </span>
                <span style={{
                  fontSize: 'var(--text-sm)',
                  fontWeight: 'var(--weight-semibold)',
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--text-primary)'
                }}>
                  ${estimatedFee}
                </span>
              </div>
              
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  预计到账
                </span>
                <span style={{
                  fontSize: 'var(--text-lg)',
                  fontWeight: 'var(--weight-bold)',
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--success)'
                }}>
                  ${receiveAmount}
                </span>
              </div>
              
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  预计时间
                </span>
                <span style={{
                  fontSize: 'var(--text-sm)',
                  fontWeight: 'var(--weight-semibold)',
                  color: 'var(--text-primary)'
                }}>
                  {estimatedTime}
                </span>
              </div>
            </div>
            
            {/* Info */}
            <div style={{
              padding: 'var(--spacing-md)',
              borderRadius: 'var(--radius-md)',
              background: 'var(--info-light)',
              border: '1px solid #007FFF20',
              fontSize: 'var(--text-xs)',
              color: 'var(--text-secondary)',
              lineHeight: 'var(--leading-relaxed)'
            }}>
              💡 跨链桥接需要等待链上确认，预计 {estimatedTime} 后到账
            </div>
          </div>
          
          {/* Actions */}
          <div style={{
            padding: 'var(--spacing-xl)',
            borderTop: '1px solid var(--border-light)',
            display: 'flex',
            gap: 'var(--spacing-md)'
          }}>
            <button
              onClick={onCancel}
              disabled={loading}
              style={{
                flex: 1,
                padding: 'var(--spacing-lg)',
                borderRadius: 'var(--radius-lg)',
                border: '1px solid var(--border-light)',
                background: 'var(--surface-card)',
                color: 'var(--text-primary)',
                fontSize: 'var(--text-base)',
                fontWeight: 'var(--weight-semibold)',
                cursor: loading ? 'not-allowed' : 'pointer',
                transition: 'all var(--transition-base)',
                opacity: loading ? 0.5 : 1
              }}
            >
              取消
            </button>
            <button
              onClick={() => onConfirm(parseFloat(amount))}
              disabled={!canConfirm}
              style={{
                flex: 2,
                padding: 'var(--spacing-lg)',
                borderRadius: 'var(--radius-lg)',
                border: 'none',
                background: canConfirm ? 'var(--brand-primary)' : 'var(--surface-secondary)',
                color: 'var(--text-white)',
                fontSize: 'var(--text-base)',
                fontWeight: 'var(--weight-bold)',
                cursor: canConfirm ? 'pointer' : 'not-allowed',
                transition: 'all var(--transition-base)',
                boxShadow: canConfirm ? 'var(--shadow-md)' : 'none',
                opacity: canConfirm ? 1 : 0.5
              }}
              onMouseEnter={(e) => {
                if (canConfirm) {
                  e.currentTarget.style.transform = 'translateY(-2px)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-lg)';
                }
              }}
              onMouseLeave={(e) => {
                if (canConfirm) {
                  e.currentTarget.style.transform = 'translateY(0)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-md)';
                }
              }}
            >
              {loading ? '桥接中...' : '开始桥接'}
            </button>
          </div>
        </div>
      );
    };
    
    // ==================== Demo Application ====================
    function StatusComponentsDemo() {
      const [progressStatus, setProgressStatus] = useState('processing');
      const [currentStep, setCurrentStep] = useState(0);
      
      const progressSteps = [
        { label: '验证账户余额', description: '检查可用资金' },
        { label: '配置 Agent Wallet', description: '授权并初始化' },
        { label: '提交策略参数', description: '上传到执行引擎' },
        { label: '启动策略', description: '开始监控和执行' }
      ];
      
      useEffect(() => {
        if (progressStatus === 'processing' && currentStep < progressSteps.length) {
          const timer = setTimeout(() => {
            if (currentStep < progressSteps.length - 1) {
              setCurrentStep(currentStep + 1);
            } else {
              setProgressStatus('success');
              setCurrentStep(progressSteps.length);
            }
          }, 2000);
          return () => clearTimeout(timer);
        }
      }, [currentStep, progressStatus]);
      
      return (
        <DesignCanvas 
          title="AI Trading Status & Feedback Components"
          subtitle="状态卡片、进度显示、风险提示等反馈组件的完整交互规范"
        >
          <DCSection id="banners" title="提示条 Banner">
            <DCArtboard 
              id="risk-banner-info" 
              label="RiskBanner - 信息提示"
              width={600}
              height={120}
            >
              <div style={{ padding: 'var(--spacing-xl)' }}>
                <RiskBanner 
                  type="info"
                  title="资金隔离说明"
                  message="Agent Account 的资金独立于主账户，仅用于自动化交易，保护您的主要资产安全。"
                />
              </div>
            </DCArtboard>
            
            <DCArtboard 
              id="risk-banner-warning" 
              label="RiskBanner - 警告"
              width={600}
              height={120}
            >
              <div style={{ padding: 'var(--spacing-xl)' }}>
                <RiskBanner 
                  type="warning"
                  title="未设置止损"
                  message="建议设置止损以控制风险。未设置止损可能导致亏损扩大。"
                />
              </div>
            </DCArtboard>
            
            <DCArtboard 
              id="risk-banner-danger" 
              label="RiskBanner - 危险警告"
              width={600}
              height={120}
            >
              <div style={{ padding: 'var(--spacing-xl)' }}>
                <RiskBanner 
                  type="danger"
                  title="账户余额不足"
                  message="当前 Agent Account 余额低于 10%，可能影响策略正常执行，请及时充值。"
                  dismissible={false}
                />
              </div>
            </DCArtboard>
          </DCSection>
          
          <DCSection id="status-cards" title="状态卡片">
            <DCArtboard 
              id="strategy-status-running" 
              label="StrategyStatusCard - 运行中"
              width={520}
              height={640}
            >
              <div style={{ 
                padding: 'var(--spacing-xl)',
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center'
              }}>
                <StrategyStatusCard 
                  strategyName="Funding Harvester"
                  strategyId="strategy_001"
                  status="running"
                  totalInvestment={2500}
                  currentEquity={2615.50}
                  totalPnl={115.50}
                  roe={4.62}
                  assets={['BTC', 'ETH']}
                  nextRebalance="2h 15m"
                  onViewDetails={() => alert('查看详情')}
                  onPause={() => alert('暂停策略')}
                />
              </div>
            </DCArtboard>
            
            <DCArtboard 
              id="strategy-status-paused" 
              label="StrategyStatusCard - 已暂停"
              width={520}
              height={640}
            >
              <div style={{ 
                padding: 'var(--spacing-xl)',
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center'
              }}>
                <StrategyStatusCard 
                  strategyName="Funding Harvester"
                  strategyId="strategy_002"
                  status="paused"
                  totalInvestment={1500}
                  currentEquity={1475.20}
                  totalPnl={-24.80}
                  roe={-1.65}
                  assets={['SOL', 'HYPE']}
                  onViewDetails={() => alert('查看详情')}
                  onResume={() => alert('恢复策略')}
                />
              </div>
            </DCArtboard>
          </DCSection>
          
          <DCSection id="progress" title="执行进度">
            <DCArtboard 
              id="execution-progress-active" 
              label="ExecutionProgress - 进行中"
              width={500}
              height={480}
            >
              <div style={{ 
                padding: 'var(--spacing-xl)',
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center'
              }}>
                <ExecutionProgress 
                  steps={progressSteps}
                  currentStep={currentStep}
                  status={progressStatus}
                />
              </div>
            </DCArtboard>
            
            <DCArtboard 
              id="execution-progress-error" 
              label="ExecutionProgress - 错误"
              width={500}
              height={480}
            >
              <div style={{ 
                padding: 'var(--spacing-xl)',
                display: 'flex',
                justifyContent: 'center',
                alignItems: 'center'
              }}>
                <ExecutionProgress 
                  steps={[
                    { label: '验证账户余额', description: '检查可用资金' },
                    { label: '配置 Agent Wallet', description: '授权并初始化' },
                    { 
                      label: '提交策略参数', 
                      description: '上传到执行引擎',
                      error: '网络连接超时，请检查网络后重试'
                    },
                    { label: '启动策略', description: '开始监控和执行' }
                  ]}
                  currentStep={2}
                  status="error"
                />
              </div>
            </DCArtboard>
          </DCSection>
          
          <DCSection id="bridge" title="跨链桥接面板">
            <DCArtboard 
              id="bridge-panel" 
              label="BridgePanel"

              <div style={{ 
                padding: 'var(--spacing-xl)',
                display: 'flex',

              }}>

                  onConfirm={(amount) => alert(`桥接 $${amount}`)}
                  onCancel={() => alert('取消')}
                />
              </div>
            </DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }
    
    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<StatusComponentsDemo />);
  </script>
</body>
