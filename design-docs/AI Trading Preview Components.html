<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trading Preview & Status Components - 设计规范</title>
  <link rel="stylesheet" href="design-tokens.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: var(--font-body), var(--font-chinese);
      background: var(--surface-background);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }
    
    #root {
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const { DesignCanvas, DCArtboard, DCSection } = window;
    
    // ==================== 1. OrderPreviewCard ====================
    const OrderPreviewCard = ({ 
      platform = 'Hyperliquid',
      marketType = 'perp', // 'perp' | 'spot'
      action = 'open_long', // 'open_long' | 'open_short' | 'close' | 'buy' | 'sell'
      asset = 'ETH',
      orderType = 'market', // 'market' | 'limit'
      sizeUsd = 500,
      leverage = 2,
      limitPrice = null,
      tpPercent = null,
      slPercent = null,
      estimatedQty = 0.4,
      estimatedFee = 1.25,
      estimatedLiquidationPrice = 1250,
      accountBalance = 3200,
      currentPrice = 2500,
      onConfirm = () => {},
      onCancel = () => {},
      loading = false
    }) => {
      const notionalUsd = marketType === 'perp' ? sizeUsd * leverage : sizeUsd;
      
      const getActionLabel = () => {
        if (marketType === 'spot') {
          return action === 'buy' ? '买入' : '卖出';
        }
        if (action === 'open_long') return '开多';
        if (action === 'open_short') return '开空';
        return '平仓';
      };
      
      const getActionColor = () => {
        if (action.includes('long') || action === 'buy') return '#10B981';
        if (action.includes('short') || action === 'sell') return '#D4183D';
        return '#007FFF';
      };
      
      const showWarnings = marketType === 'perp' && (!slPercent || leverage > 5);
      
      return (
        <div style={{
          width: '100%',
          maxWidth: '480px',
          borderRadius: 'var(--radius-xl)',
          background: 'var(--surface-card)',
          border: '1px solid var(--border-light)',
          boxShadow: 'var(--shadow-lg)',
          overflow: 'hidden'
        }}>
          {/* Header */}
          <div style={{
            padding: 'var(--spacing-xl)',
            borderBottom: '1px solid var(--border-light)',
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'space-between'
          }}>
            <div>
              <div style={{
                fontSize: 'var(--text-xs)',
                color: 'var(--text-secondary)',
                marginBottom: '4px'
              }}>
                {platform}
              </div>
              <div style={{
                fontSize: 'var(--text-2xl)',
                fontWeight: 'var(--weight-bold)',
                color: 'var(--text-primary)',
                display: 'flex',
                alignItems: 'center',
                gap: 'var(--spacing-sm)'
              }}>
                订单预览
                <span style={{
                  fontSize: 'var(--text-xs)',
                  padding: '4px 10px',
                  borderRadius: 'var(--radius-sm)',
                  background: marketType === 'perp' ? 'var(--surface-accent)' : 'var(--success-light)',
                  color: marketType === 'perp' ? 'var(--brand-primary)' : 'var(--success)',
                  fontWeight: 'var(--weight-semibold)'
                }}>
                  {marketType === 'perp' ? '永续合约' : '现货'}
                </span>
              </div>
            </div>
            <button
              onClick={onCancel}
              style={{
                width: '32px',
                height: '32px',
                borderRadius: '50%',
                border: 'none',
                background: 'var(--surface-secondary)',
                color: 'var(--text-secondary)',
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                fontSize: '18px',
                transition: 'all var(--transition-fast)'
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.background = 'var(--border-light)';
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.background = 'var(--surface-secondary)';
              }}
            >
              ×
            </button>
          </div>
          
          {/* Main Info */}
          <div style={{
            padding: 'var(--spacing-xl)',
            display: 'flex',
            flexDirection: 'column',
            gap: 'var(--spacing-lg)'
          }}>
            {/* Action & Asset */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: 'var(--spacing-md)',
              padding: 'var(--spacing-lg)',
              borderRadius: 'var(--radius-lg)',
              background: `${getActionColor()}08`,
              border: `1px solid ${getActionColor()}20`
            }}>
              <span style={{
                fontSize: 'var(--text-3xl)',
                fontWeight: 'var(--weight-bold)',
                color: getActionColor()
              }}>
                {getActionLabel()}
              </span>
              <span style={{
                fontSize: 'var(--text-3xl)',
                fontWeight: 'var(--weight-bold)',
                color: 'var(--text-primary)'
              }}>
                {asset}
              </span>
            </div>
            
            {/* Details Grid */}
            <div style={{
              display: 'flex',
              flexDirection: 'column',
              gap: 'var(--spacing-md)'
            }}>
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  订单类型
                </span>
                <span style={{ fontSize: 'var(--text-base)', fontWeight: 'var(--weight-semibold)', color: 'var(--text-primary)' }}>
                  {orderType === 'market' ? '市价单' : `限价单 @ $${limitPrice}`}
                </span>
              </div>
              
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  投入金额
                </span>
                <span style={{ 
                  fontSize: 'var(--text-lg)', 
                  fontWeight: 'var(--weight-bold)', 
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--text-primary)' 
                }}>
                  ${sizeUsd.toLocaleString()} USDC
                </span>
              </div>
              
              {marketType === 'perp' && (
                <>
                  <div style={{
                    display: 'flex',
                    justifyContent: 'space-between',
                    alignItems: 'center'
                  }}>
                    <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                      杠杆倍数
                    </span>
                    <span style={{ 
                      fontSize: 'var(--text-lg)', 
                      fontWeight: 'var(--weight-bold)',
                      color: leverage > 3 ? 'var(--warning)' : 'var(--text-primary)'
                    }}>
                      {leverage}x
                    </span>
                  </div>
                  
                  <div style={{
                    display: 'flex',
                    justifyContent: 'space-between',
                    alignItems: 'center'
                  }}>
                    <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                      名义仓位
                    </span>
                    <span style={{ 
                      fontSize: 'var(--text-lg)', 
                      fontWeight: 'var(--weight-bold)',
                      fontFamily: 'var(--font-mono)',
                      color: 'var(--text-primary)' 
                    }}>
                      ${notionalUsd.toLocaleString()}
                    </span>
                  </div>
                </>
              )}
              
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  预估数量
                </span>
                <span style={{ 
                  fontSize: 'var(--text-base)', 
                  fontWeight: 'var(--weight-semibold)',
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--text-primary)' 
                }}>
                  {estimatedQty} {asset}
                </span>
              </div>
              
              {(tpPercent || slPercent) && (
                <div style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center',
                  padding: 'var(--spacing-md)',
                  borderRadius: 'var(--radius-md)',
                  background: 'var(--surface-cool)'
                }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: '4px' }}>
                    {tpPercent && (
                      <div style={{ fontSize: 'var(--text-xs)', color: 'var(--success)' }}>
                        📈 止盈: +{tpPercent}%
                      </div>
                    )}
                    {slPercent && (
                      <div style={{ fontSize: 'var(--text-xs)', color: 'var(--danger)' }}>
                        📉 止损: -{slPercent}%
                      </div>
                    )}
                  </div>
                </div>
              )}
              
              <div style={{ height: '1px', background: 'var(--border-light)', margin: 'var(--spacing-sm) 0' }} />
              
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  预估手续费
                </span>
                <span style={{ 
                  fontSize: 'var(--text-sm)', 
                  fontWeight: 'var(--weight-medium)',
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--text-primary)' 
                }}>
                  ${estimatedFee}
                </span>
              </div>
              
              {marketType === 'perp' && (
                <div style={{
                  display: 'flex',
                  justifyContent: 'space-between',
                  alignItems: 'center'
                }}>
                  <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                    强平价格
                  </span>
                  <span style={{ 
                    fontSize: 'var(--text-base)', 
                    fontWeight: 'var(--weight-bold)',
                    fontFamily: 'var(--font-mono)',
                    color: 'var(--danger)' 
                  }}>
                    ${estimatedLiquidationPrice.toLocaleString()}
                  </span>
                </div>
              )}
              
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  账户余额
                </span>
                <span style={{ 
                  fontSize: 'var(--text-sm)', 
                  fontWeight: 'var(--weight-medium)',
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--text-primary)' 
                }}>
                  ${accountBalance.toLocaleString()} USDC
                </span>
              </div>
            </div>
            
            {/* Warnings */}
            {showWarnings && (
              <div style={{
                padding: 'var(--spacing-md)',
                borderRadius: 'var(--radius-md)',
                background: !slPercent ? 'var(--warning-light)' : 'var(--danger-light)',
                border: `1px solid ${!slPercent ? '#EAB30820' : '#D4183D20'}`
              }}>
                <div style={{
                  fontSize: 'var(--text-sm)',
                  color: 'var(--text-primary)',
                  fontWeight: 'var(--weight-semibold)',
                  marginBottom: '4px'
                }}>
                  {!slPercent ? '⚠️ 未设置止损' : '⚠️ 高杠杆风险'}
                </div>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  lineHeight: 'var(--leading-relaxed)'
                }}>
                  {!slPercent 
                    ? '建议设置止损以控制风险。未设置止损可能导致亏损扩大。'
                    : `${leverage}x 杠杆下，市场小幅波动即可能触发强平，请谨慎操作。`
                  }
                </div>
              </div>
            )}
          </div>
          
          {/* Actions */}
          <div style={{
            padding: 'var(--spacing-xl)',
            borderTop: '1px solid var(--border-light)',
            display: 'flex',
            gap: 'var(--spacing-md)'
          }}>
            <button
              onClick={onCancel}
              disabled={loading}
              style={{
                flex: 1,
                padding: 'var(--spacing-lg)',
                borderRadius: 'var(--radius-lg)',
                border: '1px solid var(--border-light)',
                background: 'var(--surface-card)',
                color: 'var(--text-primary)',
                fontSize: 'var(--text-base)',
                fontWeight: 'var(--weight-semibold)',
                cursor: loading ? 'not-allowed' : 'pointer',
                transition: 'all var(--transition-base)',
                opacity: loading ? 0.5 : 1
              }}
              onMouseEnter={(e) => {
                if (!loading) e.currentTarget.style.background = 'var(--surface-secondary)';
              }}
              onMouseLeave={(e) => {
                if (!loading) e.currentTarget.style.background = 'var(--surface-card)';
              }}
            >
              取消
            </button>
            <button
              onClick={onConfirm}
              disabled={loading}
              style={{
                flex: 2,
                padding: 'var(--spacing-lg)',
                borderRadius: 'var(--radius-lg)',
                border: 'none',
                background: loading ? 'var(--surface-secondary)' : getActionColor(),
                color: 'var(--text-white)',
                fontSize: 'var(--text-base)',
                fontWeight: 'var(--weight-bold)',
                cursor: loading ? 'not-allowed' : 'pointer',
                transition: 'all var(--transition-base)',
                boxShadow: loading ? 'none' : 'var(--shadow-md)',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                gap: 'var(--spacing-sm)'
              }}
              onMouseEnter={(e) => {
                if (!loading) {
                  e.currentTarget.style.transform = 'translateY(-2px)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-lg)';
                }
              }}
              onMouseLeave={(e) => {
                if (!loading) {
                  e.currentTarget.style.transform = 'translateY(0)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-md)';
                }
              }}
            >
              {loading ? '处理中...' : `确认${getActionLabel()}`}
            </button>
          </div>
        </div>
      );
    };
    
    // ==================== 2. StrategyPreviewCard ====================
    const StrategyPreviewCard = ({
      strategyName = 'Funding Harvester',
      strategyType = 'funding_harvester',
      description = '通过现货+反向合约对冲，赚取资金费率收益',
      totalInvestment = 2500,
      selectedAssets = ['BTC', 'ETH'],
      // Funding-specific params
      fundingRateThreshold = 0.01, // 触发开仓的最低资金费率（%）
      spotPerpRatio = '1:1', // 现货:合约比例
      settlementFrequency = '每8小时',
      minHoldingPeriod = '24小时', // 最短持仓周期
      // General params
      rebalanceFrequency = '每8小时',
      historicalApy = { min: 15, max: 55 },
      maxDrawdown = { min: 2, max: 5 },
      riskLevel = 'low', // 'low' | 'medium' | 'high'
      onConfirm = () => {},
      onCancel = () => {},
      onEdit = () => {},
      loading = false,
      showRiskAcknowledgement = false
    }) => {
      const [acknowledged, setAcknowledged] = useState(false);
      const [detailsExpanded, setDetailsExpanded] = useState(false);
      
      const assetLogos = {
        BTC: 'https://s2.coinmarketcap.com/static/img/coins/64x64/1.png',
        ETH: 'https://s2.coinmarketcap.com/static/img/coins/64x64/1027.png',
        SOL: 'https://s2.coinmarketcap.com/static/img/coins/64x64/5426.png',
        HYPE: 'https://s2.coinmarketcap.com/static/img/coins/64x64/32196.png'
      };
      
      return (
        <div style={{
          width: '100%',
          maxWidth: '520px',
          borderRadius: 'var(--radius-xl)',
          background: 'var(--surface-card)',
          border: '1px solid var(--border-light)',
          boxShadow: 'var(--shadow-lg)',
          overflow: 'hidden'
        }}>
          {/* Header */}
          <div style={{
            padding: 'var(--spacing-xl)',
            background: 'linear-gradient(135deg, var(--surface-accent) 0%, var(--surface-blue-light) 100%)',
            borderBottom: '1px solid var(--border-light)'
          }}>
            <div style={{
              display: 'flex',
              alignItems: 'flex-start',
              justifyContent: 'space-between',
              marginBottom: 'var(--spacing-md)'
            }}>
              <div style={{ flex: 1 }}>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: '4px'
                }}>
                  AI 推荐策略
                </div>
                <div style={{
                  fontSize: 'var(--text-2xl)',
                  fontWeight: 'var(--weight-bold)',
                  color: 'var(--text-primary)',
                  marginBottom: 'var(--spacing-xs)'
                }}>
                  {strategyName}
                </div>
                <div style={{
                  fontSize: 'var(--text-sm)',
                  color: 'var(--text-secondary)',
                  lineHeight: 'var(--leading-relaxed)'
                }}>
                  {description}
                </div>
              </div>
              <button
                onClick={onCancel}
                style={{
                  width: '32px',
                  height: '32px',
                  borderRadius: '50%',
                  border: 'none',
                  background: 'white',
                  color: 'var(--text-secondary)',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  fontSize: '18px',
                  boxShadow: 'var(--shadow-sm)',
                  transition: 'all var(--transition-fast)',
                  flexShrink: 0
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.background = 'var(--surface-secondary)';
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.background = 'white';
                }}
              >
                ×
              </button>
            </div>
            
            {/* Expected Returns */}
            <div style={{
              display: 'flex',
              gap: 'var(--spacing-lg)',
              marginTop: 'var(--spacing-lg)'
            }}>
              <div style={{
                flex: 1,
                padding: 'var(--spacing-md)',
                borderRadius: 'var(--radius-md)',
                background: 'white',
                border: '1px solid var(--border-light)'
              }}>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: '4px'
                }}>
                  历史年化收益
                </div>
                <div style={{
                  fontFamily: 'var(--font-mono)',
                  fontSize: 'var(--text-xl)',
                  fontWeight: 'var(--weight-bold)',
                  color: 'var(--success)'
                }}>
                  {historicalApy.min}% - {historicalApy.max}%
                </div>
                <div style={{
                  fontSize: '10px',
                  color: 'var(--text-tertiary)',
                  marginTop: '4px'
                }}>
                  取决于资金费率水平
                </div>
              </div>
              <div style={{
                flex: 1,
                padding: 'var(--spacing-md)',
                borderRadius: 'var(--radius-md)',
                background: 'white',
                border: '1px solid var(--border-light)'
              }}>
                <div style={{
                  fontSize: 'var(--text-xs)',
                  color: 'var(--text-secondary)',
                  marginBottom: '4px'
                }}>
                  历史最大回撤
                </div>
                <div style={{
                  fontFamily: 'var(--font-mono)',
                  fontSize: 'var(--text-xl)',
                  fontWeight: 'var(--weight-bold)',
                  color: 'var(--warning)'
                }}>
                  {maxDrawdown.min}% - {maxDrawdown.max}%
                </div>
                <div style={{
                  fontSize: '10px',
                  color: 'var(--text-tertiary)',
                  marginTop: '4px'
                }}>
                  价格对冲，风险较低
                </div>
              </div>
            </div>
          </div>
          
          {/* Configuration */}
          <div style={{
            padding: 'var(--spacing-xl)',
            display: 'flex',
            flexDirection: 'column',
            gap: 'var(--spacing-lg)'
          }}>
            <div style={{
              display: 'flex',
              justifyContent: 'space-between',
              alignItems: 'center'
            }}>
              <span style={{
                fontSize: 'var(--text-base)',
                fontWeight: 'var(--weight-semibold)',
                color: 'var(--text-primary)'
              }}>
                策略配置
              </span>
              <button
                onClick={onEdit}
                style={{
                  padding: '6px 12px',
                  borderRadius: 'var(--radius-md)',
                  border: '1px solid var(--brand-primary)',
                  background: 'var(--surface-accent)',
                  color: 'var(--brand-primary)',
                  fontSize: 'var(--text-sm)',
                  fontWeight: 'var(--weight-semibold)',
                  cursor: 'pointer',
                  transition: 'all var(--transition-fast)'
                }}
                onMouseEnter={(e) => {
                  e.currentTarget.style.background = 'var(--brand-primary)';
                  e.currentTarget.style.color = 'white';
                }}
                onMouseLeave={(e) => {
                  e.currentTarget.style.background = 'var(--surface-accent)';
                  e.currentTarget.style.color = 'var(--brand-primary)';
                }}
              >
                编辑
              </button>
            </div>
            
            <div style={{
              display: 'flex',
              flexDirection: 'column',
              gap: 'var(--spacing-md)',
              padding: 'var(--spacing-lg)',
              borderRadius: 'var(--radius-lg)',
              background: 'var(--surface-cool)',
              border: '1px solid var(--border-light)'
            }}>
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  总投入
                </span>
                <span style={{
                  fontSize: 'var(--text-lg)',
                  fontWeight: 'var(--weight-bold)',
                  fontFamily: 'var(--font-mono)',
                  color: 'var(--text-primary)'
                }}>
                  ${totalInvestment.toLocaleString()} USDC
                </span>
              </div>
              
              <div style={{
                display: 'flex',
                justifyContent: 'space-between',
                alignItems: 'center'
              }}>
                <span style={{ fontSize: 'var(--text-sm)', color: 'var(--text-secondary)' }}>
                  目标资产
                </span>
                <div style={{
                  display: 'flex',
                  gap: 'var(--spacing-xs)',
                  alignItems: 'center'
                }}>
                  {selectedAssets.map(asset => (
                    <div
                      key={asset}
                      style={{
                        display: 'flex',
                        alignItems: 'center',
                        gap: '4px',
                        padding: '4px 8px',
                        borderRadius: 'var(--radius-sm)',
                        background: 'white',
                        border: '1px solid var(--border-light)'
                      }}
                    >
                      <img 
                        src={assetLogos[asset]}
                        alt={asset}
                        style={{ width: '16px', height: '16px' }}
                      />

                if (canConfirm) {
                  e.currentTarget.style.transform = 'translateY(-2px)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-lg)';
                }
              }}
              onMouseLeave={(e) => {
                if (canConfirm) {
                  e.currentTarget.style.transform = 'translateY(0)';
                  e.currentTarget.style.boxShadow = 'var(--shadow-md)';
                }
              }}
            >
              {loading ? '处理中...' : '确认转账'}
            </button>
          </div>
        </div>
      );
    };
